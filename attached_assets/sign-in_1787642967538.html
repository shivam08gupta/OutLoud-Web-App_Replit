<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>OutLoud - Sign Up / Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#dae2fd",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#eef0ff",
                        "on-secondary-container": "#006f67",
                        "primary-container": "#172554",
                        "on-secondary-fixed": "#00201d",
                        "surface-bright": "#faf8ff",
                        "on-error": "#ffffff",
                        "primary": "#000f3f",
                        "on-primary-fixed": "#071747",
                        "on-tertiary-fixed": "#191c1e",
                        "on-tertiary-fixed-variant": "#444749",
                        "surface-container-lowest": "#ffffff",
                        "background": "#faf8ff",
                        "surface-container": "#eaedff",
                        "on-tertiary": "#ffffff",
                        "secondary": "#006a63",
                        "surface-container-highest": "#dae2fd",
                        "tertiary": "#111416",
                        "surface-container-low": "#f2f3ff",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#374475",
                        "on-surface": "#131b2e",
                        "on-primary-container": "#808dc2",
                        "surface-dim": "#d2d9f4",
                        "error": "#ba1a1a",
                        "inverse-primary": "#b7c4fd",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#8d9092",
                        "on-background": "#131b2e",
                        "secondary-fixed-dim": "#80d5cb",
                        "tertiary-fixed": "#e0e3e5",
                        "surface-tint": "#4f5c8e",
                        "surface-container-high": "#e2e7ff",
                        "tertiary-container": "#25292b",
                        "outline-variant": "#c6c5d0",
                        "inverse-surface": "#283044",
                        "primary-fixed-dim": "#b7c4fd",
                        "secondary-fixed": "#9cf2e8",
                        "on-secondary-fixed-variant": "#00504a",
                        "secondary-container": "#99efe5",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "on-surface-variant": "#45464f",
                        "primary-fixed": "#dce1ff",
                        "outline": "#767680",
                        "surface": "#faf8ff",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "md": "24px",
                        "container-max": "1280px",
                        "base": "4px",
                        "lg": "40px",
                        "sm": "16px",
                        "xs": "8px",
                        "xl": "64px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Geist"],
                        "headline-md": ["Geist"],
                        "label-md": ["Geist"],
                        "body-lg": ["Inter"],
                        "caption": ["Inter"],
                        "display-lg": ["Geist"],
                        "headline-lg-mobile": ["Geist"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F8FAFC;
        }
    </style>
</head>
<body class="h-full flex items-center justify-center font-body-md text-on-surface antialiased bg-[#F8FAFC]">
<!-- Main Container -->
<div class="w-full max-w-md px-4 sm:px-0">
<!-- Logo Header -->
<div class="flex justify-center mb-8">
<span class="font-display-lg text-display-lg text-primary">OutLoud</span>
</div>
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 p-8 sm:p-10">
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- SSO Button -->
<button class="w-full flex items-center justify-center gap-3 bg-primary text-on-primary font-label-md text-label-md py-3 px-sm rounded-lg hover:opacity-90 transition-opacity mb-6">
<!-- SVG Google Icon for consistency, avoiding arbitrary images -->
<svg class="w-5 h-5 fill-current bg-white rounded-full p-0.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<div class="relative flex items-center py-5">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-4 font-caption text-caption text-on-surface-variant">or</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Email Form -->
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/10 transition-all" id="email" placeholder="name@company.com" type="email">
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-caption text-caption text-primary hover:underline" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/10 transition-all" id="password" placeholder="••••••••" type="password">
</div>
<button class="w-full bg-surface-container-lowest border border-outline-variant text-primary font-label-md text-label-md py-3 px-sm rounded-lg hover:bg-surface-variant/20 transition-colors" type="button">
                    Continue with Email
                </button>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? <a class="text-primary font-medium hover:underline" href="#">Sign up</a>
</p>
</div>
</div>
<!-- Optional minimal footer info if needed -->
<div class="mt-8 text-center flex justify-center gap-4">
<a class="font-caption text-caption text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="font-caption text-caption text-on-surface-variant">•</span>
<a class="font-caption text-caption text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</div>
</body></html>
